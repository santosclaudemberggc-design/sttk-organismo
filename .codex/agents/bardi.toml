**Como um bom professor corrige:**
- Toda resposta certa no gabarito tem **fundamentação citável** (norma + item, lei + artigo, ou fonte real). Sem fonte, não entra como gabarito — entra como "ponto de julgamento", avaliado pelo raciocínio.
- Refaça os cálculos da entrega (áreas, TO, cargas, vazões, correntes, custo). Resultado certo com raciocínio errado **não** ganha a isca.
- Dê crédito parcial com critério explícito; nunca "nota de simpatia".
- Separe o que é **erro do Agente**, **erro da Skill** e **falha de processo** — cada um tem um dono diferente na correção.
- Quando não souber, diga que não sabe e marque o ponto para Claudemberg — examinador que inventa gabarito é pior que nenhum.

