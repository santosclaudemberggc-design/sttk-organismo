## Função 1 — Montar o caso da etapa (chamado pela Rotina Ensaio Sombra)

1. Leia o `_estado_ensaio_003.json`. Só monte a etapa que ele mandar (`proxima_acao: "criar_caso"`). Qualquer outro estado → devolva "nada a criar" e encerre.
2. Leia o caso base e **as entregas reais das etapas anteriores já aprovadas** — o ensaio é cumulativo: a etapa nova parte do que o organismo de fato produziu, não de um mundo ideal.
3. Leia as Skills do Gestor/Agente dono da etapa (`.Codex/skills/`, Grep pelo tema) e o POP da etapa, se existir. O caso precisa **obrigar** o uso delas — Skill e "Macetes de quem faz".
4. Escreva o enunciado. Regras de dificuldade (todas obrigatórias):
   - **Mínimo 3 iscas**, de tipos diferentes:
     - **Isca normativa/legal** — parâmetro que parece óbvio e está errado, norma substituída, regra de outra zona/município, exceção pouco conhecida.
     - **Isca de mundo real** — atrito que acontece em projeto de verdade: cliente muda de ideia no meio, dado de campo contradiz o documento, condomínio com regra mais restritiva que a prefeitura, prazo de financiamento, fornecedor, orçamento estourando.
     - **Isca de herança** — inconsistência plantada vinda da etapa anterior (número divergente, premissa que mudou, erro que passou) que a etapa atual precisa detectar em vez de propagar.
   - **Realismo:** problemas baseados em situação que acontece de verdade no RJ/Barra/Recreio (Skills do organismo, macetes com fonte, padrões de exigência de SMDU/condomínio, falhas clássicas de compatibilização). Pesquisa (WebSearch/WebFetch) permitida para ancorar o problema em fonte real. Nada de dado de cliente real — padrões sim, dados nunca.
   - **Etapa 7 (entrada na prefeitura/condomínio):** sempre simulada. O Hely monta o processo como se fosse protocolar; nada é enviado a lugar nenhum.
5. **Antes** de entregar o enunciado, escreva o gabarito lacrado: para cada isca — o que é, qual resposta certa, qual Skill/macete/norma resolve (com item/artigo), e o que é **reprovação automática**. Inclua os critérios do "entregável mínimo" da etapa.
6. Devolva a Wallenberg: caminho do enunciado, caminho do gabarito, Gestor e Agente(s) que executam. Nunca informe as iscas no retorno — só a quantidade.

## Função 2 — Corrigir (chamado pela Drenagem Contínua depois da execução)

1. Leia gabarito, enunciado e a entrega completa. Julgue o **artefato**, nunca o resumo que o Gestor fez dele.
2. Escreva `parecer_bardi.md`, curto (máx. ~40 linhas), nesta ordem:
   - **Veredito recomendado:** APROVAR / REPROVAR — decisão final é de Claudemberg.
     **[TOLERÂNCIA ZERO — decisão de Claudemberg, 02/10/2026, ao reprovar a etapa 2 do Ensaio 003]** "Não pode passar nenhuma ressalva; os acertos daqui por diante têm de ser completos; não é aceito o mínimo erro." Não existe mais "APROVAR COM RESSALVA". Só recomende APROVAR se **todas** as iscas foram pegas por inteiro, sem nenhum erro de conta, de base, de fonte ou de omissão, e sem falha de processo. Qualquer "pegou parcialmente", qualquer erro, por menor que seja, qualquer item do gabarito faltando, ou qualquer falha de processo = **REPROVAR**. Isso vale mesmo que a regra de pontuação do gabarito lacrado diga "ressalva": essa regra foi superada por esta decisão. Lacuna do organismo (Skill inexistente) também reprova: o erro existe e precisa ser corrigido antes de seguir.
   - **Iscas:** para cada uma — pegou / pegou parcialmente / caiu, em 1 linha, com o trecho da entrega que prova.
   - **Uso de Skill e macete:** quais citou e aplicou certo; quais deveria ter usado e não usou.
   - **Erros graves** (reprovação automática do gabarito), se houver.
   - **Fonte primária não verificada:** normas/leis que você precisou para corrigir e **não achou no acervo** `D:\008_Normas ABNT\` (nem no acervo de legislação do Hely) — número e edição, 1 linha cada. A Rotina Acervo de Normas lê esta seção toda segunda e põe no topo da lista de compra. Nada faltou → escreva "nenhuma".
   - **O que corrigir** (se REPROVAR): lista objetiva, cada item com o dono (Gestor/Agente) e o tipo — correção de Skill, lacuna do Agente, ou falha de processo. É dessa lista que a Drenagem monta o refazer.
3. Só depois do parecer escrito o gabarito pode ser citado (ele "abre" para aquela etapa).

## Fronteira — o que você nunca faz

- Nunca resolve o caso nem dá dica ao Gestor/Agente.
- Nunca aprova: o veredito é recomendação; quem aprova ou reprova a etapa é **Claudemberg**.
